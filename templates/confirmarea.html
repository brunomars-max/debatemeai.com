<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Confirm Area</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</head>

<body>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #0f0f0f;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(224, 87, 74, 0.10), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(224, 87, 74, 0.07), transparent 40%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #eee;
    }

    .ticket {
      position: relative;
      max-width: 440px;
      width: 100%;
      background: #141414;
      border: 0.5px solid #2a2a2a;
      border-radius: 18px;
      box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .ticket-top {
      padding: 30px 32px 26px;
      text-align: center;
    }

    .kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #e0857a;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.35;
      color: #fff;
      margin: 0 0 26px;
    }

    .vs-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .stance-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(224, 87, 74, 0.14);
      border: 0.5px solid #e0574a;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      padding: 9px 20px;
      border-radius: 999px;
    }

    .stance-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e0574a;
      box-shadow: 0 0 8px #e0574a;
    }

    .vs-label {
      font-size: 11px;
      letter-spacing: 1px;
      color: #555;
      font-weight: 700;
    }

    .ai-side {
      font-size: 13px;
      color: #777;
      font-weight: 600;
      padding: 9px 20px;
      border: 0.5px dashed #333;
      border-radius: 999px;
    }

    .perforation {
      position: relative;
      height: 0;
      border-top: 1px dashed #2a2a2a;
      margin: 0 32px;
    }

    .perforation::before,
    .perforation::after {
      content: "";
      position: absolute;
      top: -11px;
      width: 22px;
      height: 22px;
      background: #0f0f0f;
      border-radius: 50%;
    }

    .perforation::before {
      left: -43px;
    }

    .perforation::after {
      right: -43px;
    }

    .ticket-bottom {
      padding: 24px 32px 32px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 0.5px solid #212121;
    }

    .meta-row:last-of-type {
      border-bottom: none;
    }

    .meta-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #666;
    }

    .meta-value {
      font-size: 13px;
      font-weight: 600;
      color: #eee;
    }

    .level-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
      color: #fff;
      background: #1a1a1a;
      border: 0.5px solid #2a2a2a;
      padding: 5px 12px;
      border-radius: 8px;
    }

    .level-bars {
      display: flex;
      gap: 2px;
      align-items: flex-end;
    }

    .level-bars span {
      width: 3px;
      border-radius: 2px;
      background: #3a3a3a;
    }

    .level-bars span:nth-child(1) {
      height: 6px;
    }

    .level-bars span:nth-child(2) {
      height: 9px;
    }

    .level-bars span:nth-child(3) {
      height: 12px;
    }

    .level-badge.advanced .level-bars span {
      background: #e0574a;
    }

    button {
      margin-top: 26px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #e0574a;
      color: #fff;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
      padding: 14px 20px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background: #c9483d;
    }

    button:active {
      transform: scale(0.98);
    }

    .fine-print {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin-top: 14px;
    }

    a {
      text-decoration: none;
      color: white;
    }
  </style>

  <div class="ticket">
    <div class="ticket-top">
      <div class="kicker">Debate Me <span style="color:#e0574a">AI</span> &middot; Ready to begin</div>
      <h1>{{ info['topic']}}</h1>
      <div class="vs-row">
        <span class="stance-pill"><span class="dot"></span>{{info['Position']}}</span>
        <span class="vs-label">VS</span>
        <span class="ai-side">AI</span>
      </div>
    </div>

    <div class="perforation"></div>

    <div class="ticket-bottom">
      <div class="meta-row">
        <span class="meta-label">Your position</span>
        <span class="meta-value">{{info['Position']}}</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Difficulty</span>
        <span class="level-badge advanced">
          {{info['level']}}
          <span class="level-bars"><span></span><span></span><span></span></span>
        </span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Format</span>
        <span class="meta-value">Live, 1v1</span>
      </div>

      <button id="confirmBtn"><a>Confirm and start debate</a></button>
      <button><a href="/topicarea">Change topic</a></button>
      <div class="fine-print">You can switch sides or topic anytime before it starts</div>
    </div>
  </div>

  <script>
    let confirmBtn = document.getElementById("confirmBtn")
    confirmBtn.addEventListener("click", triggersaveinfo)
    function triggersaveinfo() {
      let info = {
        "topic": "{{info['topic']}}",
        "position": "{{info['Position']}}",
        "level": "{{info['level']}}",
        "userid":Math.floor(Math.random()*100000000000000000),
      }
      console.log(info)
      localStorage.setItem("playerinfo",JSON.stringify(info))
      window.location.href = "http://127.0.0.1:5000/debatearea";
    }
  </script>

</body>

</html>
