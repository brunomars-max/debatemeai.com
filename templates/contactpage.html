<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; }

  body {
    margin:0;
    min-height:100vh;
    background:#0a0a0a;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:#eee;
  }

  #page {
    width:100%;
    min-height:100vh;
    background:#141414;
    display:flex;
    flex-direction:column;
  }

  /* navbar */
  .navbar-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 48px;
    border-bottom:0.5px solid #2a2a2a;
  }

  .brand { font-weight:600; font-size:17px; color:#fff; text-decoration:none; transition:opacity 0.2s ease; }
  .brand:hover { opacity:0.8; }
  .brand:focus { outline:2px solid #e0857a; border-radius:4px; }
  .brand span { color:#e0574a; }

  .navlinks { display:flex; gap:24px; font-size:13px; color:#999; }
  .navlinks a { color:#999; text-decoration:none; transition:color 0.2s ease; }
  .navlinks a:hover { color:#e0857a; }
  .navlinks .current { color:#e0857a; font-weight:500; }
  .navlinks a:focus { outline:2px solid #e0574a; border-radius:4px; }

  .navbtn {
    background:#e0574a;
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    transition:background 0.2s ease, transform 0.1s ease;
    display:inline-block;
  }

  .navbtn:hover { background:#c9483d; }
  .navbtn:active { transform:scale(0.98); }
  .navbtn:focus { outline:2px solid #e0857a; outline-offset:2px; }

  /* hero */
  .hero {
    text-align:center;
    padding:56px 28px 8px;
  }

  .hero h1 {
    font-size:26px;
    font-weight:600;
    margin:0 0 8px;
    color:#eee;
  }

  .hero p {
    font-size:14px;
    color:#999;
    max-width:420px;
    margin:0 auto;
  }

  /* form */
  .form-wrap {
    max-width:480px;
    width:100%;
    margin:0 auto;
    padding:36px 20px 20px;
    flex:1;
  }

  .field { margin-bottom:14px; }

  .field label {
    display:block;
    font-size:12px;
    font-weight:600;
    color:#ccc;
    margin-bottom:6px;
  }

  .field input,
  .field select,
  .field textarea {
    width:100%;
    background:#1c1c1c;
    border:1px solid #333;
    border-radius:10px;
    padding:11px 14px;
    font-size:14px;
    color:#eee;
    outline:none;
    font-family:inherit;
    resize:none;
    transition:border-color 0.2s ease, background-color 0.2s ease;
  }

  .field input::placeholder,
  .field textarea::placeholder { color:#666; }

  .field input:focus,
  .field select:focus,
  .field textarea:focus { 
    border-color:#e0574a;
    background:#1f1f1f;
    box-shadow:0 0 0 3px rgba(224, 87, 74, 0.1);
  }

  .field select {
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:36px;
  }

  .field textarea {
    height:90px;
  }

  .send-btn {
    width:100%;
    background:#e0574a;
    color:#fff;
    border:none;
    padding:12px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.1s ease;
  }

  .send-btn:hover { background:#c9483d; }
  .send-btn:active { transform:scale(0.98); }
  .send-btn:focus { outline:2px solid #e0857a; outline-offset:2px; }

  /* footer contact row */
  .contact-footer {
    display:flex;
    justify-content:center;
    gap:32px;
    padding:28px 28px 48px;
    border-top:0.5px solid #2a2a2a;
    margin-top:24px;
  }

  .contact-item { 
    text-align:center;
    transition:transform 0.2s ease;
  }

  .contact-item:hover { transform:translateY(-2px); }

  .contact-item i {
    font-size:18px;
    color:#e0857a;
  }

  .contact-item div {
    font-size:12px;
    color:#999;
    margin-top:6px;
  }

  @media (max-width:700px) {
    .navlinks { display:none; }
  }
</style>
</head>
<body>

<div id="page">

  <div class="navbar-row">
    <a href="/" class="brand">Debate Me <span>AI</span></a>
    <div class="navlinks">
      <a href="/">Homepage</a>
      <a href="/howitworks">How it works</a>
      <a href="/topicarea">Topics</a>
      <a href="/pricingpage">Pricing</a>
      <a href="/contactpage" class="current">Contact</a>
    </div>
    <a href="/topicarea" class="navbtn">Start a debate</a>
  </div>

  <div class="hero">
    <h1>Get in touch</h1>
    <p>Bug reports, feedback, partnership questions, debate club inquiries, all welcome.</p>
  </div>

  <div class="form-wrap">
    <form>
      <div class="field">
        <label for="contact-name">Name</label>
        <input type="text" id="contact-name" placeholder="Your name" required>
      </div>
      <div class="field">
        <label for="contact-email">Email</label>
        <input type="email" id="contact-email" placeholder="name@email.com" required>
      </div>
      <div class="field">
        <label for="contact-topic">What's this about</label>
        <select id="contact-topic">
          <option>Feedback</option>
          <option>Bug report</option>
          <option>Partnership</option>
          <option>Debate club inquiry</option>
          <option>Something else</option>
        </select>
      </div>
      <div class="field">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" placeholder="Tell us what's on your mind..."></textarea>
      </div>
      <button type="submit" class="send-btn">Send message</button>
    </form>
  </div>

  <div class="contact-footer">
    <div class="contact-item">
      <i class="ti ti-mail" aria-hidden="true"></i>
      <div>hello@debateme.ai</div>
    </div>
    <div class="contact-item">
      <i class="ti ti-brand-x" aria-hidden="true"></i>
      <div>@debatemeai</div>
    </div>
  </div>

</div>

</body>
</html>
