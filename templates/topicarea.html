<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic Area</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        height:100%;
      }

      body
      {
        display:flex;
        flex-direction:column;
        margin:0;
        min-height:100vh;
        background:#0f0f0f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color:#eee;
      }

      #tools-container
      {
        background:#141414;
        width:100%;
        min-height:100vh;
        display:flex;
        flex-direction:column;
      }

      .navbar-row {
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:18px 48px;
        border-bottom:0.5px solid #2a2a2a;
      }

      .brand { font-weight:600; font-size:17px; color:#fff; text-decoration:none; transition:opacity 0.2s ease; }
      .brand:hover { opacity:0.8; }
      .brand:focus { outline:2px solid #e0857a; border-radius:4px; }
      .brand span { color:#e0574a; }

      .navlinks { display:flex; gap:24px; font-size:13px; color:#999; }
      .navlinks a { color:#999; text-decoration:none; transition:color 0.2s ease; }
      .navlinks a:hover { color:#e0857a; }
      .navlinks .current { color:#e0857a; font-weight:500; }
      .navlinks a:focus { outline:2px solid #e0574a; border-radius:4px; }

      .navbtn {
        background:#e0574a;
        color:#fff;
        border:none;
        padding:8px 16px;
        border-radius:8px;
        font-size:13px;
        font-weight:600;
        cursor:pointer;
        transition:background 0.2s ease, transform 0.1s ease;
      }
      .navbtn:hover { background:#c9483d; }
      .navbtn:active { transform:scale(0.98); }
      .navbtn:focus { outline:2px solid #e0857a; outline-offset:2px; }

      .hero { padding:48px 48px 8px; }
      .hero h1 {
        font-size:34px;
        font-weight:600;
        margin:0 0 8px;
        color:#fff;
        text-align:left;
      }
      .hero p { font-size:15px; color:#999; max-width:520px; margin:0; }

      .topics-body {
        flex:1;
        padding:32px 48px 12px;
        max-width:1200px;
        width:100%;
        margin:0 auto;
      }

      .category-label {
        font-size:12px;
        text-transform:uppercase;
        letter-spacing:0.5px;
        color:#e0857a;
        margin-bottom:12px;
      }

      .topic-grid {
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:10px;
        margin-bottom:28px;
      }

      .topic-chip {
        background:#1a1a1a;
        border:0.5px solid #2a2a2a;
        border-radius:10px;
        padding:14px 16px;
        font-size:14px;
        line-height:1.35;
        color:#eee;
        text-align:left;
        cursor:pointer;
        transition:border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
      }
      .topic-chip:hover {
        border-color:#e0574a;
        background:#211816;
      }
      .topic-chip:active {
        transform:scale(0.98);
      }
      .topic-chip:focus {
        outline:2px solid #e0857a;
        outline-offset:2px;
      }
      .topic-chip.selected {
        border-color:#e0574a;
        background:rgba(224,87,74,0.14);
        color:#fff;
      }

      .own-topic-row { text-align:center; padding:8px 48px 0; }
      .own-topic-box {
        display:inline-block;
        background:#1a1a1a;
        border:0.5px solid #2a2a2a;
        border-radius:10px;
        padding:14px 20px;
        font-size:13px;
        color:#999;
      }
      .own-topic-box span { color:#e0857a; font-weight:600; }

      .setup-panel {
        margin:28px auto 48px;
        max-width:520px;
        width:calc(100% - 96px);
        background:#1a1a1a;
        border:0.5px solid #2a2a2a;
        border-radius:12px;
        padding:22px 24px 26px;
      }

      .setup-label {
        font-size:12px;
        text-transform:uppercase;
        letter-spacing:0.5px;
        color:#e0857a;
        margin-bottom:12px;
      }

      #typeInput {
        width:100%;
        background:#141414;
        border:0.5px solid #2a2a2a;
        border-radius:10px;
        padding:12px 14px;
        font-size:14px;
        color:#eee;
        outline:none;
        transition:border-color 0.2s ease, background-color 0.2s ease;
      }
      #typeInput::placeholder {
        color:#777;
      }
      #typeInput:focus {
        border-color:#e0574a;
        background:#1f1f1f;
        box-shadow:0 0 0 3px rgba(224, 87, 74, 0.1);
      }

      .stance-row { display:flex; gap:10px; margin-top:14px; }

      #opposerBtn,
      #proposerBtn
      {
        flex:1;
        border-radius:8px;
        margin-top:0;
        border:0.5px solid #2a2a2a;
        background:#141414;
        color:#eee;
        font-size:13px;
        font-weight:600;
        padding:10px 18px;
        cursor:pointer;
        transition:all 0.2s ease;
      }
      #opposerBtn:hover,
      #proposerBtn:hover {
        border-color:#e0574a;
        background:#1f1f1f;
      }
      #opposerBtn:focus,
      #proposerBtn:focus {
        outline:2px solid #e0857a;
        outline-offset:2px;
      }
      .active {
        background-color: #e0574a !important;
        color: #fff !important;
        border-color:#e0574a !important;
      }

      #levelSelect {
        margin-top:14px;
        width:100%;
        background:#141414;
        border:0.5px solid #2a2a2a;
        border-radius:10px;
        padding:10px 14px;
        font-size:13px;
        color:#eee;
        outline:none;
        cursor:pointer;
        transition:border-color 0.2s ease, background-color 0.2s ease;
      }
      #levelSelect:hover {
        border-color:#e0857a;
      }
      #levelSelect:focus {
        border-color:#e0574a;
        background:#1f1f1f;
        box-shadow:0 0 0 3px rgba(224, 87, 74, 0.1);
      }

      #submitBtn
      {
        margin-top:16px;
        width:100%;
        border-radius:8px;
        border:none;
        background:#e0574a;
        color:#fff;
        font-size:14px;
        font-weight:600;
        padding:12px 24px;
        cursor:pointer;
        transition:background 0.2s ease, transform 0.1s ease;
      }
      #submitBtn:hover {
        background:#c9483d;
      }
      #submitBtn:active {
        transform:scale(0.98);
      }
      #submitBtn:focus {
        outline:2px solid #e0857a;
        outline-offset:2px;
      }
      #link
      {
        text-decoration:none;
        color:inherit;
        transition:color 0.2s ease;
      }
      #link:hover { color:#e0857a; }
      #link:focus { outline:2px solid #e0574a; border-radius:4px; }
    </style>
</head>
<body>
    <!---navbar here-->
<div id="tools-container">

  <div class="navbar-row">
    <a href="/" class="brand">Debate Me <span>AI</span></a>
    <div class="navlinks">
      <a href="/" id="link">Homepage</a><a href="/how it works" id="link">How it works</a><a href="/topicarea" class="current" id="link">Topics</a><a href="/pricingpage" id="link">Pricing</a><a href="/contactpage" id="link">Contact</a>
    </div>
    <button class="navbtn">Start a debate</button>
  </div>

  <div class="hero">
    <h1>Pick a topic, or bring your own</h1>
    <p>Browse by category or type any position below. Nothing here is off limits.</p>
  </div>

  <div class="topics-body">

    <div class="category-label">Everyday life</div>
    <div class="topic-grid" id="topicChips">
      <button type="button" class="topic-chip" id="TopicChip1">Remote work beats office work</button>
      <button type="button" class="topic-chip" id="TopicChip2">Social media does more harm than good</button>
      <button type="button" class="topic-chip" id="TopicChip3">College is still worth the cost</button>
    </div>

    <div class="category-label">Tech and AI</div>
    <div class="topic-grid">
      <button type="button" class="topic-chip" id="TopicChip4">AI will create more jobs than it destroys</button>
      <button type="button" class="topic-chip" id="TopicChip5">Privacy is already dead, stop pretending</button>
      <button type="button" class="topic-chip" id="TopicChip6">Open source AI is safer than closed</button>
    </div>

    <div class="category-label">Competition prep</div>
    <div class="topic-grid" style="margin-bottom:8px">
      <button type="button" class="topic-chip" id="TopicChip7">Standardized testing should be abolished</button>
      <button type="button" class="topic-chip" id="TopicChip8">A universal basic income should exist</button>
      <button type="button" class="topic-chip" id="TopicChip9">Term limits should apply to all offices</button>
    </div>

  </div>

  <div class="own-topic-row">
    <div class="own-topic-box">Don't see your topic? <span>Type your own below</span></div>
  </div>

  <div class="setup-panel">
    <div class="setup-label">Your topic</div>
    <form method="POST"action="/confirmarea">
    <input placeholder="type in a topic" type="text" id="typeInput"name="topic">

    <div class="stance-row">
      <button type="button" id="opposerBtn">opposer</button>
      <button type="button" class="active" id="proposerBtn">proposer</button>
      <input name="Position" id="positioninput"type="hidden"value="proposer">
    </div>

    <select id="levelSelect"name="level">
        <option value="beginner">beginner </option>
        <option value="intermediate">intermediate</option>
        <option value="advanced">advanced</option>
    </select>

    <button type="submit" id="submitBtn">Submit</button>
    </form>
  </div>

</div>
    <script>
    let opposerBtn = document.getElementById("opposerBtn")
    let proposerBtn = document.getElementById("proposerBtn")
    let positioninput = document.getElementById("positioninput")
    let TopicChip1 = document.getElementById("TopicChip1")
    let TopicChip2 = document.getElementById("TopicChip2")
    let TopicChip3 = document.getElementById("TopicChip3")
    let TopicChip4 = document.getElementById("TopicChip4")
    let TopicChip5 = document.getElementById("TopicChip5")
    let TopicChip6 = document.getElementById("TopicChip6")
    let TopicChip7 = document.getElementById("TopicChip7")
    let TopicChip8 = document.getElementById("TopicChip8")
    let TopicChip9 = document.getElementById("TopicChip9")

    opposerBtn.addEventListener("click", triggerOpposer)
    proposerBtn.addEventListener("click", triggerProposer)
    TopicChip1.addEventListener("click", FillTopic1)
    TopicChip2.addEventListener("click", FillTopic2)
    TopicChip3.addEventListener("click", FillTopic3)
    TopicChip4.addEventListener("click", FillTopic4)
    TopicChip5.addEventListener("click", FillTopic5)
    TopicChip6.addEventListener("click", FillTopic6)
    TopicChip7.addEventListener("click", FillTopic7)
    TopicChip8.addEventListener("click", FillTopic8)
    TopicChip9.addEventListener("click", FillTopic9)

    function FillTopic1(){
        let typeInput = document.getElementById("typeInput")
        typeInput.value ="Remote work beats office work"
    }
    function FillTopic2(){
        let typeInput = document.getElementById("typeInput")
        typeInput.value ="Climate change is the most pressing issue of our time"
    }
    function FillTopic3(){
        let typeInput = document.getElementById("typeInput")
        typeInput.value ="Social media has more negative than positive effects on society"
    }
    function FillTopic4(){
        let typeInput = document.getElementById("typeInput")
        typeInput.value ="The death penalty is a necessary deterrent"
    }
    function FillTopic5(){
        let typeInput = document.getElementById("typeInput")
        typeInput.value ="Universal healthcare should be a fundamental right"
    }
    function FillTopic6(){
        let typeInput = document.getElementById("typeInput")
        typeInput.value ="Colleges should be free for all students"
    }
    function FillTopic7(){
        let typeInput = document.getElementById("typeInput")
        typeInput.value ="Standardized testing should be abolished"
    }
    function FillTopic8(){
        let typeInput = document.getElementById("typeInput")
        typeInput.value ="A universal basic income should exist"
    }
    function FillTopic9(){
        let typeInput = document.getElementById("typeInput")
        typeInput.value ="Term limits should apply to all offices"
    }

    function triggerOpposer(){
        opposerBtn.classList.add("active")
        proposerBtn.classList.remove("active")
        positioninput.value = "opposer"
    }
     function triggerProposer(){
    proposerBtn.classList.add("active")
    opposerBtn.classList.remove("active")
    positioninput.value = "proposer"
    }
    </script>
</body>
</html>
